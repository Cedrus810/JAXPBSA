[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxpbsa"
version = "0.1.0"
description = "JAX-accelerated MM/PBSA analysis for OpenMM trajectories"
readme = "DESIGN.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "jax"]

[project.optional-dependencies]
openmm = ["openmm"]
traj = ["mdtraj"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["jaxpbsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
